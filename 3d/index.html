<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="build" content="webgl-3d-v1"/>
<title>Zombie Rage 3D</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{display:block;touch-action:none}.hidden{display:none!important}#hud{position:fixed;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#050505c9;border:1px solid #ffffff26;border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px #0009;font-weight:900}.small{font-size:11px;color:#bbb}.meter{width:min(42vw,260px);height:10px;background:#1b0a08;border:1px solid #7f261d;border-radius:6px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b51c16,#ff6048)}#rageMeter{position:fixed;z-index:10;left:128px;right:120px;bottom:22px;height:16px;border:1px solid #b96c16;background:#1c0c03;border-radius:10px;overflow:hidden;pointer-events:none}#rageMeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7f12,#ffd139)}#stick{position:fixed;z-index:12;left:20px;bottom:20px;width:92px;height:92px;border:2px solid #ffffff40;background:#0005;border-radius:50%;touch-action:none}#knob{position:absolute;left:26px;top:26px;width:36px;height:36px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff9a}#fire,#rage{position:fixed;z-index:12;border-radius:50%;color:white;font-weight:1000;touch-action:none}#fire{right:20px;bottom:18px;width:78px;height:78px;border:3px solid #ff5c41;background:#7f160fdd;font-size:28px;box-shadow:0 0 24px #ff321b55}#rage{right:106px;bottom:31px;width:52px;height:52px;border:2px solid #ffc24f;background:#5d240edc;font-size:10px}#banner{position:fixed;z-index:14;top:23%;left:0;right:0;text-align:center;font-size:clamp(30px,10vw,58px);font-weight:1000;font-style:italic;text-shadow:0 4px 14px #000,0 0 18px #ff321a;pointer-events:none}#menu,#over{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:0 20px 7vh;background:linear-gradient(180deg,#0000 30%,#05050555 55%,#050505ee 90%)}#menu .card,#over .card{width:min(92vw,480px);position:relative;z-index:2}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.32em;color:#ffb08f}.logo{margin:8px 0 0;font-size:clamp(60px,18vw,104px);line-height:.72;letter-spacing:-.06em;font-style:italic;font-weight:1000;text-shadow:0 6px 0 #270503,0 0 24px #ff321a55}.logo span{color:#ef3524}.tag{margin:18px 0 14px;font-size:12px;font-weight:900;letter-spacing:.22em;color:#ddd}.btn{width:100%;padding:14px 16px;margin-top:8px;border-radius:8px;border:1px solid #6c5a50;background:#151413dc;color:#fff;font-weight:1000;letter-spacing:.06em}.btn.primary{border-color:#ff765e;background:linear-gradient(#d43a2a,#7a160f);font-size:20px;box-shadow:0 0 24px #ff311c44}.diffs{display:flex;gap:6px;margin-top:8px}.diffs button{flex:1;padding:10px 4px;border-radius:6px;border:1px solid #5d514a;background:#111d;color:#ccc;font-weight:900}.diffs button.active{border-color:#ff674d;background:#5c1711;color:#fff}#over{align-items:center;background:#050505e9}#over h2{font-size:54px;color:#ef3524;margin:0}.boss{position:fixed;z-index:11;left:16%;right:16%;top:68px;height:12px;border:1px solid #ffac36;background:#230402;border-radius:8px;overflow:hidden}.boss i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a21710,#ff8b22)}
</style>
</head>
<body>
<div id="hud" class="hidden"><div class="panel"><div>HP <span id="hp">100</span></div><div class="meter"><i id="hpFill"></i></div><div class="small">WAVE <span id="wave">1</span> • KILLS <span id="kills">0</span></div></div><div class="panel" style="text-align:right"><div id="weapon">RIFLE</div><div class="small">SCORE <span id="score">0</span></div></div></div>
<div id="bossbar" class="boss hidden"><i></i></div>
<div id="rageMeter" class="hidden"><i id="rageFill"></i></div>
<div id="stick" class="hidden"><div id="knob"></div></div>
<button id="rage" class="hidden">RAGE<br><span id="ragePct">0</span>%</button>
<button id="fire" class="hidden">✹</button>
<div id="banner"></div>
<div id="menu"><div class="card"><div class="eyebrow">ORIGINAL WEBGL 3D BUILD</div><h1 class="logo">ZOMBIE<br><span>RAGE</span></h1><div class="tag">NO MERCY. JUST SURVIVE.</div><button id="play" class="btn primary">▶ ENTER THE DEAD ZONE</button><div class="diffs"><button data-d="easy">EASY</button><button data-d="normal" class="active">NORMAL</button><button data-d="hard">HARD</button></div></div></div>
<div id="over" class="hidden"><div class="card"><h2>YOU DIED</h2><p id="final"></p><button id="again" class="btn primary">FIGHT AGAIN</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=s=>document.querySelector(s);
let W=innerWidth,H=innerHeight,state='menu',difficulty='normal',wave=1,kills=0,score=0,health=100,rage=0,rageTime=0,moveX=0,moveY=0,shotCooldown=0,best=+localStorage.zr3dBest||0;
const cfg={easy:{spd:.72,dmg:.65,hp:125,count:.8},normal:{spd:1,dmg:1,hp:100,count:1},hard:{spd:1.28,dmg:1.35,hp:90,count:1.2}};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d12);scene.fog=new THREE.FogExp2(0x0a0c0e,.022);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);camera.position.set(0,6.2,10.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x8aa4c4,0x180907,1.25);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd1a1,2.25);sun.position.set(-8,18,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
const fireLight=new THREE.PointLight(0xff3b16,18,30,2);fireLight.position.set(6,3,-16);scene.add(fireLight);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(48,180),new THREE.MeshStandardMaterial({color:0x242426,roughness:.95,metalness:.03}));ground.rotation.x=-Math.PI/2;ground.position.z=-52;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<30;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,2.2),new THREE.MeshStandardMaterial({color:0xc5af62,roughness:.8}));m.position.set(0,.02,6-i*5.5);m.receiveShadow=true;scene.add(m)}
for(const x of [-8,8]){for(let i=0;i<12;i++){const h=4+Math.random()*11,w=3+Math.random()*4,d=3+Math.random()*5;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:i%3?0x111318:0x19191d,roughness:1}));b.position.set(x+(Math.random()-.5)*3,h/2,-i*10-4);b.castShadow=b.receiveShadow=true;scene.add(b);if(i%2===0){const fl=new THREE.PointLight(0xff4a1d,8,10,2);fl.position.set(b.position.x,1.4,b.position.z+1);scene.add(fl)}}}
for(let i=0;i<10;i++){const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,.8,1.5),new THREE.MeshStandardMaterial({color:i%2?0x33120e:0x1a2025,metalness:.35,roughness:.7}));body.position.y=.6;body.castShadow=body.receiveShadow=true;car.add(body);for(const sx of [-1.1,1.1])for(const sz of [-.65,.65]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.28,12),new THREE.MeshStandardMaterial({color:0x080808}));wh.rotation.z=Math.PI/2;wh.position.set(sx,.35,sz);car.add(wh)}car.position.set((i%2?-5.3:5.4)+(Math.random()-.5)*1.2,0,-6-i*9);car.rotation.y=(i%2?-.18:.22);scene.add(car)}

function mat(color,metal=.1,rough=.65){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough})}
function limb(geo,material){const m=new THREE.Mesh(geo,material);m.castShadow=m.receiveShadow=true;return m}
function makeHumanoid(kind='hero',scale=1){const g=new THREE.Group();const hero=kind==='hero',runner=kind==='runner',brute=kind==='brute',boss=kind==='boss';const skin=hero?0x1a1e24:boss?0x62413a:brute?0x59634b:0x72805b;const armor=hero?0x222832:boss?0x341513:brute?0x36402e:0x3d4733;const body=limb(new THREE.CapsuleGeometry((boss?.85:brute?.68:.52),1.45,5,10),mat(armor,hero?.5:.08,hero?.38:.8));body.position.y=2.15;g.add(body);const head=limb(new THREE.SphereGeometry(boss?.67:brute?.56:.46,18,14),mat(skin,0,.8));head.position.y=3.45;g.add(head);const hips=limb(new THREE.BoxGeometry(boss?1.55:brute?1.25:1.0,.48,.72),mat(armor,.1,.72));hips.position.y=1.32;g.add(hips);const armMat=mat(hero?0x303743:skin,hero?.25:.02,.72),legMat=mat(hero?0x15191e:0x3b4433,.05,.86);for(const s of [-1,1]){const arm=limb(new THREE.CapsuleGeometry(.18*(boss?1.6:brute?1.3:1),1.15*(boss?1.35:brute?1.2:1),4,8),armMat);arm.name=s<0?'armL':'armR';arm.position.set(s*(boss?1.05:brute?.85:.7),2.2,0);arm.rotation.z=s*.16;g.add(arm);const leg=limb(new THREE.CapsuleGeometry(.21*(boss?1.45:brute?1.25:1),1.2*(boss?1.25:1),4,8),legMat);leg.name=s<0?'legL':'legR';leg.position.set(s*(boss?.5:brute?.42:.34),.45,0);g.add(leg)}if(hero){const visor=new THREE.Mesh(new THREE.BoxGeometry(.62,.11,.08),new THREE.MeshStandardMaterial({color:0xff2f1e,emissive:0xff1b0d,emissiveIntensity:3}));visor.position.set(0,3.49,-.43);g.add(visor);const gun=new THREE.Group();const receiver=limb(new THREE.BoxGeometry(.28,.28,1.55),mat(0x343a43,.72,.32));receiver.position.z=-.45;gun.add(receiver);const barrel=limb(new THREE.CylinderGeometry(.06,.06,1.35,10),mat(0x17191c,.8,.25));barrel.rotation.x=Math.PI/2;barrel.position.z=-1.38;gun.add(barrel);gun.position.set(.48,2.2,-.55);gun.rotation.x=-.08;g.add(gun);g.userData.gun=gun}else{const eMat=new THREE.MeshStandardMaterial({color:boss?0xffb325:0xff3025,emissive:boss?0xff6a00:0xff0900,emissiveIntensity:4});for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),eMat);eye.position.set(s*.17,3.5,-.42);g.add(eye)}}g.scale.setScalar(scale);g.userData.kind=kind;return g}
const hero=makeHumanoid('hero',1);hero.position.set(0,0,4);scene.add(hero);

const enemies=[];
function spawnEnemy(type){type=type||(['walker','walker','runner','brute'][Math.floor(Math.random()*4)]);const scale=type==='boss'?1.65:type==='brute'?1.28:type==='runner'?.9:1;const obj=makeHumanoid(type,scale);obj.position.set((Math.random()-.5)*10,0,-38-Math.random()*70);scene.add(obj);enemies.push({obj,type,hp:type==='boss'?40+wave*4:type==='brute'?6:1,max:type==='boss'?40+wave*4:type==='brute'?6:1,spd:(type==='runner'?.085:type==='brute'?.033:type==='boss'?.027:.052)*cfg[difficulty].spd,last:0,phase:Math.random()*6});}
function fillWave(){const n=Math.ceil((4+wave*2)*cfg[difficulty].count);for(let i=0;i<n;i++)spawnEnemy();if(wave%5===0){spawnEnemy('boss');banner('BOSS WAVE')}else banner('WAVE '+wave)}
function banner(s){$('#banner').textContent=s;setTimeout(()=>$('#banner').textContent='',900)}
function clearEnemies(){for(const e of enemies)scene.remove(e.obj);enemies.length=0}
function updateHUD(){$('#hp').textContent=Math.max(0,Math.ceil(health));$('#wave').textContent=wave;$('#kills').textContent=kills;$('#score').textContent=score;$('#hpFill').style.width=Math.max(0,health/cfg[difficulty].hp*100)+'%';$('#rageFill').style.width=(rageTime?100:rage)+'%';$('#ragePct').textContent=Math.round(rageTime?100:rage)}
function start(){difficulty=$('.diffs .active').dataset.d;health=cfg[difficulty].hp;wave=1;kills=score=rage=rageTime=0;hero.position.set(0,0,4);clearEnemies();state='play';$('#menu').classList.add('hidden');$('#over').classList.add('hidden');for(const id of ['#hud','#stick','#fire','#rage','#rageMeter'])$(id).classList.remove('hidden');fillWave();updateHUD()}
function die(){state='dead';best=Math.max(best,score);localStorage.zr3dBest=best;for(const id of ['#hud','#stick','#fire','#rage','#rageMeter','#bossbar'])$(id).classList.add('hidden');$('#final').textContent=`Score ${score} • Wave ${wave} • Kills ${kills} • Best ${best}`;$('#over').classList.remove('hidden')}
function nearest(){let bestE=null,bestD=1e9;for(const e of enemies){const d=e.obj.position.distanceTo(hero.position);if(d<bestD){bestD=d;bestE=e}}return bestE}
function shoot(){if(state!=='play'||shotCooldown>0)return;const e=nearest();if(!e)return;shotCooldown=8;e.hp-=rageTime?5:1;const muzzle=new THREE.PointLight(0xffd37a,20,7,2);muzzle.position.set(hero.position.x+.45,2.1,hero.position.z-1.2);scene.add(muzzle);setTimeout(()=>scene.remove(muzzle),45);if(e.hp<=0){const boss=e.type==='boss';score+=boss?800:e.type==='brute'?90:e.type==='runner'?35:20;kills++;rage=Math.min(100,rage+(boss?45:e.type==='brute'?20:11));scene.remove(e.obj);enemies.splice(enemies.indexOf(e),1);if(!enemies.length){wave++;setTimeout(fillWave,450)}updateHUD()}}
$('#play').onclick=start;$('#again').onclick=start;document.querySelectorAll('.diffs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.diffs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#fire').onpointerdown=e=>{e.preventDefault();shoot()};$('#rage').onpointerdown=e=>{e.preventDefault();if(state==='play'&&rage>=100&&!rageTime){rage=0;rageTime=420;banner('RAGE');updateHUD()}};
let sid=null,stick=$('#stick'),knob=$('#knob');stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid)};stick.onpointermove=e=>{if(e.pointerId!==sid)return;const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=30,dd=Math.hypot(dx,dy)||1,m=Math.min(lim,dd),nx=dx/dd*m,ny=dy/dd*m;moveX=nx/lim;moveY=ny/lim;knob.style.transform=`translate(${nx}px,${ny}px)`};stick.onpointerup=e=>{if(e.pointerId===sid){sid=null;moveX=moveY=0;knob.style.transform='translate(0,0)'}};
function animateHumanoid(e,dt){const t=performance.now()*.001,run=Math.sin(t*(e.type==='runner'?12:e.type==='boss'?4:7)+e.phase),obj=e.obj;const l=obj.getObjectByName('legL'),r=obj.getObjectByName('legR'),al=obj.getObjectByName('armL'),ar=obj.getObjectByName('armR');if(l){l.rotation.x=run*.55;r.rotation.x=-run*.55;al.rotation.x=-run*.5;ar.rotation.x=run*.5}obj.position.y=Math.abs(run)*.045}
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(shotCooldown>0)shotCooldown--;if(state==='play'){hero.position.x=THREE.MathUtils.clamp(hero.position.x+moveX*dt*7,-5.5,5.5);hero.position.z=THREE.MathUtils.clamp(hero.position.z+moveY*dt*4.2,1.6,6.2);for(const e of enemies){animateHumanoid(e,dt);const dx=hero.position.x-e.obj.position.x,dz=hero.position.z-e.obj.position.z,d=Math.hypot(dx,dz)||1;e.obj.position.x+=dx/d*e.spd;e.obj.position.z+=dz/d*e.spd;e.obj.lookAt(hero.position.x,1.6,hero.position.z);if(d<1.25&&performance.now()-e.last>520){e.last=performance.now();health-=(e.type==='boss'?22:e.type==='brute'?12:6)*cfg[difficulty].dmg;updateHUD();if(health<=0)die()}}if(rageTime){rageTime--;if(!rageTime)updateHUD()}const target=new THREE.Vector3(hero.position.x,2.1,hero.position.z-4);camera.position.x+=(hero.position.x*.48-camera.position.x)*.08;camera.position.y+=(6.2-camera.position.y)*.08;camera.position.z+=(hero.position.z+7.3-camera.position.z)*.08;camera.lookAt(target);let boss=enemies.find(e=>e.type==='boss');if(boss){$('#bossbar').classList.remove('hidden');$('#bossbar i').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}else $('#bossbar').classList.add('hidden')}else if(state==='menu'){hero.rotation.y=Math.sin(performance.now()*.0007)*.12;camera.position.x=Math.sin(performance.now()*.00025)*2.1;camera.position.y=5.5;camera.position.z=10.5;camera.lookAt(0,2,-8)}renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
