<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="build" content="webgl-3d-v2"><title>Zombie Rage 3D</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#fff;font-family:Arial}canvas{display:block;touch-action:none}.hidden{display:none!important}#hud{position:fixed;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#050505c9;border:1px solid #ffffff35;border-radius:10px;padding:9px 11px;font-weight:900}.small{font-size:11px;color:#ddd}.meter{width:min(42vw,260px);height:10px;background:#1b0a08;border-radius:6px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#d32218,#ff674e)}#cross{position:fixed;z-index:13;left:50%;top:42%;width:42px;height:42px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 4px #000}#cross:before{width:2px;height:42px;left:20px}#cross:after{height:2px;width:42px;top:20px}#cross i{position:absolute;inset:12px;border:2px solid #ff543b;border-radius:50%}#rageMeter{position:fixed;z-index:10;left:128px;right:120px;bottom:22px;height:15px;border:1px solid #d17b19;background:#1c0c03;border-radius:10px;overflow:hidden}#rageMeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7f12,#ffd139)}#stick{position:fixed;z-index:12;left:20px;bottom:20px;width:92px;height:92px;border:2px solid #ffffff55;background:#0005;border-radius:50%;touch-action:none}#knob{position:absolute;left:26px;top:26px;width:36px;height:36px;border-radius:50%;background:#ffffff45;border:2px solid #ffffffaa}#fire,#rage{position:fixed;z-index:12;border-radius:50%;color:white;font-weight:1000;touch-action:none}#fire{right:20px;bottom:18px;width:78px;height:78px;border:3px solid #ff6b50;background:#8d180fe8;font-size:28px;box-shadow:0 0 28px #ff321b88}#rage{right:106px;bottom:31px;width:52px;height:52px;border:2px solid #ffc24f;background:#5d240edc;font-size:10px}#banner{position:fixed;z-index:14;top:23%;left:0;right:0;text-align:center;font-size:44px;font-weight:1000;font-style:italic;text-shadow:0 4px 14px #000,0 0 18px #ff321a;pointer-events:none}#menu,#over{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:0 20px 6vh;background:radial-gradient(circle at 50% 27%,#ff4b2133,transparent 34%),linear-gradient(180deg,#0000 25%,#05050533 52%,#050505f2 90%)}#menu .card,#over .card{width:min(92vw,480px)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.32em;color:#ffb08f}.logo{margin:8px 0;font-size:clamp(64px,19vw,108px);line-height:.7;letter-spacing:-.06em;font-style:italic;font-weight:1000;text-shadow:0 6px 0 #270503,0 0 28px #ff321a88}.logo span{color:#ef3524}.tag{margin:18px 0 14px;font-size:12px;font-weight:900;letter-spacing:.2em}.btn{width:100%;padding:14px;margin-top:8px;border-radius:8px;border:1px solid #6c5a50;background:#151413dc;color:#fff;font-weight:1000}.primary{border-color:#ff765e;background:linear-gradient(#dc3e2c,#7a160f);font-size:20px;box-shadow:0 0 26px #ff311c66}.diffs{display:flex;gap:6px;margin-top:8px}.diffs button{flex:1;padding:10px 4px;border-radius:6px;border:1px solid #5d514a;background:#111d;color:#ccc;font-weight:900}.diffs .active{border-color:#ff674d;background:#5c1711;color:#fff}#over{align-items:center;background:#050505e9}#over h2{font-size:54px;color:#ef3524}.boss{position:fixed;z-index:11;left:16%;right:16%;top:68px;height:12px;border:1px solid #ffac36;background:#230402;border-radius:8px;overflow:hidden}.boss i{display:block;height:100%;background:linear-gradient(90deg,#a21710,#ff8b22)}</style></head><body><div id="hud" class="hidden"><div class="panel"><div>HP <span id="hp">100</span></div><div class="meter"><i id="hpFill"></i></div><div class="small">WAVE <span id="wave">1</span> • KILLS <span id="kills">0</span></div></div><div class="panel"><div>RIFLE</div><div class="small">SCORE <span id="score">0</span></div></div></div><div id="bossbar" class="boss hidden"><i></i></div><div id="cross" class="hidden"><i></i></div><div id="rageMeter" class="hidden"><i id="rageFill"></i></div><div id="stick" class="hidden"><div id="knob"></div></div><button id="rage" class="hidden">RAGE<br><span id="ragePct">0</span>%</button><button id="fire" class="hidden">✹</button><div id="banner"></div><div id="menu"><div class="card"><div class="eyebrow">3D SURVIVAL SHOOTER</div><h1 class="logo">ZOMBIE<br><span>RAGE</span></h1><div class="tag">AIM • FIRE • SURVIVE</div><button id="play" class="btn primary">▶ ENTER THE DEAD ZONE</button><div class="diffs"><button data-d="easy">EASY</button><button data-d="normal" class="active">NORMAL</button><button data-d="hard">HARD</button></div></div></div><div id="over" class="hidden"><div class="card"><h2>YOU DIED</h2><p id="final"></p><button id="again" class="btn primary">FIGHT AGAIN</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const $=s=>document.querySelector(s);let state='menu',difficulty='normal',wave=1,kills=0,score=0,health=100,rage=0,rageTime=0,moveX=0,moveY=0,shotCooldown=0,best=+localStorage.zr3dBest||0,audio;const cfg={easy:{spd:.72,dmg:.65,hp:125,count:.8},normal:{spd:1,dmg:1,hp:100,count:1},hard:{spd:1.28,dmg:1.35,hp:90,count:1.2}};function sfx(type){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),gn=audio.createGain();o.connect(gn);gn.connect(audio.destination);let t=audio.currentTime;if(type==='shot'){o.type='sawtooth';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.09);gn.gain.setValueAtTime(.18,t);gn.gain.exponentialRampToValueAtTime(.001,t+.1)}else if(type==='hit'){o.type='square';o.frequency.setValueAtTime(90,t);gn.gain.setValueAtTime(.09,t);gn.gain.exponentialRampToValueAtTime(.001,t+.07)}else{o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(70,t+.24);gn.gain.setValueAtTime(.13,t);gn.gain.exponentialRampToValueAtTime(.001,t+.25)}o.start();o.stop(t+.26)}catch(e){}}const scene=new THREE.Scene();scene.background=new THREE.Color(0x273849);scene.fog=new THREE.FogExp2(0x2b3741,.009);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,220);camera.position.set(0,6.2,10.5);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7e9ff,0x563321,3.2));const sun=new THREE.DirectionalLight(0xffe2bd,4.5);sun.position.set(-8,18,7);sun.castShadow=true;scene.add(sun);const fireLight=new THREE.PointLight(0xff541f,32,36,2);fireLight.position.set(6,4,-16);scene.add(fireLight);const ground=new THREE.Mesh(new THREE.PlaneGeometry(48,180),new THREE.MeshStandardMaterial({color:0x44474b,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.position.z=-52;ground.receiveShadow=true;scene.add(ground);for(let i=0;i<30;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,2.2),new THREE.MeshStandardMaterial({color:0xe6ce70}));m.position.set(0,.02,6-i*5.5);scene.add(m)}for(const x of[-8,8])for(let i=0;i<12;i++){let h=4+Math.random()*11,b=new THREE.Mesh(new THREE.BoxGeometry(4,h,4),new THREE.MeshStandardMaterial({color:i%2?0x323942:0x3d3535,roughness:1}));b.position.set(x+(Math.random()-.5)*3,h/2,-i*10-4);b.castShadow=b.receiveShadow=true;scene.add(b)}function mat(c,m=.1,r=.65){return new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r})}function limb(geo,ma){let x=new THREE.Mesh(geo,ma);x.castShadow=x.receiveShadow=true;return x}function human(kind='hero',scale=1){let g=new THREE.Group(),hero=kind==='hero',brute=kind==='brute',boss=kind==='boss',skin=hero?0x242b35:boss?0x7b4a40:brute?0x657251:0x819363,armor=hero?0x303946:boss?0x4b211b:brute?0x3c4933:0x46543a,b=limb(new THREE.CapsuleGeometry(boss?.85:brute?.68:.52,1.45,5,10),mat(armor,hero?.45:.05,hero?.4:.78));b.position.y=2.15;g.add(b);let head=limb(new THREE.SphereGeometry(boss?.67:brute?.56:.46,18,14),mat(skin));head.position.y=3.45;g.add(head);for(const s of[-1,1]){let a=limb(new THREE.CapsuleGeometry(.18*(boss?1.6:brute?1.3:1),1.15,4,8),mat(hero?0x384352:skin));a.name=s<0?'armL':'armR';a.position.set(s*(boss?1.05:brute?.85:.7),2.2,0);g.add(a);let l=limb(new THREE.CapsuleGeometry(.21*(boss?1.45:brute?1.25:1),1.2,4,8),mat(hero?0x1b2027:0x3d4934));l.name=s<0?'legL':'legR';l.position.set(s*.34,.45,0);g.add(l)}if(hero){let visor=new THREE.Mesh(new THREE.BoxGeometry(.62,.11,.08),new THREE.MeshStandardMaterial({color:0xff3927,emissive:0xff1b0d,emissiveIntensity:4}));visor.position.set(0,3.49,-.43);g.add(visor);let gun=limb(new THREE.BoxGeometry(.28,.28,1.8),mat(0x343b45,.75,.3));gun.position.set(.48,2.2,-1);g.add(gun)}else for(const s of[-1,1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshStandardMaterial({color:0xff3025,emissive:0xff0900,emissiveIntensity:5}));eye.position.set(s*.17,3.5,-.42);g.add(eye)}g.scale.setScalar(scale);g.userData.kind=kind;return g}const hero=human();hero.position.set(0,0,4);scene.add(hero);const enemies=[];function spawn(type){type=type||(['walker','walker','runner','brute'][Math.floor(Math.random()*4)]);let sc=type==='boss'?1.65:type==='brute'?1.28:type==='runner'?.9:1,obj=human(type,sc),max=type==='boss'?40+wave*4:type==='brute'?6:1;obj.position.set((Math.random()-.5)*10,0,-38-Math.random()*70);scene.add(obj);enemies.push({obj,type,hp:max,max,spd:(type==='runner'?.085:type==='brute'?.033:type==='boss'?.027:.052)*cfg[difficulty].spd,last:0,phase:Math.random()*6})}function banner(x){$('#banner').textContent=x;setTimeout(()=>$('#banner').textContent='',900)}function fillWave(){let n=Math.ceil((4+wave*2)*cfg[difficulty].count);for(let i=0;i<n;i++)spawn();if(wave%5===0){spawn('boss');banner('BOSS WAVE')}else banner('WAVE '+wave)}function clear(){for(const e of enemies)scene.remove(e.obj);enemies.length=0}function hud(){$('#hp').textContent=Math.max(0,Math.ceil(health));$('#wave').textContent=wave;$('#kills').textContent=kills;$('#score').textContent=score;$('#hpFill').style.width=Math.max(0,health/cfg[difficulty].hp*100)+'%';$('#rageFill').style.width=(rageTime?100:rage)+'%';$('#ragePct').textContent=Math.round(rageTime?100:rage)}function start(){difficulty=$('.diffs .active').dataset.d;health=cfg[difficulty].hp;wave=1;kills=score=rage=rageTime=0;hero.position.set(0,0,4);clear();state='play';$('#menu').classList.add('hidden');$('#over').classList.add('hidden');for(const id of['#hud','#cross','#stick','#fire','#rage','#rageMeter'])$(id).classList.remove('hidden');fillWave();hud();sfx('start')}function die(){state='dead';best=Math.max(best,score);localStorage.zr3dBest=best;for(const id of['#hud','#cross','#stick','#fire','#rage','#rageMeter','#bossbar'])$(id).classList.add('hidden');$('#final').textContent=`Score ${score} • Wave ${wave} • Kills ${kills} • Best ${best}`;$('#over').classList.remove('hidden')}const ray=new THREE.Raycaster(),center=new THREE.Vector2(0,0);function shoot(){if(state!=='play'||shotCooldown>0)return;shotCooldown=8;sfx('shot');ray.setFromCamera(center,camera);let meshes=[];for(const e of enemies)e.obj.traverse(o=>{if(o.isMesh){o.userData.enemy=e;meshes.push(o)}});let hit=ray.intersectObjects(meshes,false)[0];let muzzle=new THREE.PointLight(0xffdc91,32,9,2);muzzle.position.set(hero.position.x+.45,2.2,hero.position.z-1.2);scene.add(muzzle);setTimeout(()=>scene.remove(muzzle),55);if(!hit)return;let e=hit.object.userData.enemy;e.hp-=rageTime?5:1;sfx('hit');if(e.hp<=0){let boss=e.type==='boss';score+=boss?800:e.type==='brute'?90:e.type==='runner'?35:20;kills++;rage=Math.min(100,rage+(boss?45:e.type==='brute'?20:11));scene.remove(e.obj);enemies.splice(enemies.indexOf(e),1);if(!enemies.length){wave++;setTimeout(fillWave,450)}hud()}}$('#play').onclick=start;$('#again').onclick=start;document.querySelectorAll('.diffs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.diffs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#fire').onpointerdown=e=>{e.preventDefault();shoot()};$('#rage').onpointerdown=e=>{e.preventDefault();if(rage>=100&&!rageTime){rage=0;rageTime=420;banner('RAGE');hud()}};let sid=null,stick=$('#stick'),knob=$('#knob');stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid)};stick.onpointermove=e=>{if(e.pointerId!==sid)return;let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=30,d=Math.hypot(dx,dy)||1,m=Math.min(lim,d),nx=dx/d*m,ny=dy/d*m;moveX=nx/lim;moveY=ny/lim;knob.style.transform=`translate(${nx}px,${ny}px)`};stick.onpointerup=e=>{if(e.pointerId===sid){sid=null;moveX=moveY=0;knob.style.transform='translate(0,0)'}};function anim(e){let t=performance.now()*.001,r=Math.sin(t*(e.type==='runner'?12:e.type==='boss'?4:7)+e.phase),o=e.obj,l=o.getObjectByName('legL'),rr=o.getObjectByName('legR'),a=o.getObjectByName('armL'),ar=o.getObjectByName('armR');if(l){l.rotation.x=r*.55;rr.rotation.x=-r*.55;a.rotation.x=-r*.5;ar.rotation.x=r*.5}o.position.y=Math.abs(r)*.045}const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.033);if(shotCooldown)shotCooldown--;if(state==='play'){hero.position.x=THREE.MathUtils.clamp(hero.position.x+moveX*dt*7,-5.5,5.5);hero.position.z=THREE.MathUtils.clamp(hero.position.z+moveY*dt*4.2,1.6,6.2);for(const e of enemies){anim(e);let dx=hero.position.x-e.obj.position.x,dz=hero.position.z-e.obj.position.z,d=Math.hypot(dx,dz)||1;e.obj.position.x+=dx/d*e.spd;e.obj.position.z+=dz/d*e.spd;e.obj.lookAt(hero.position.x,1.6,hero.position.z);if(d<1.25&&performance.now()-e.last>520){e.last=performance.now();health-=(e.type==='boss'?22:e.type==='brute'?12:6)*cfg[difficulty].dmg;hud();if(health<=0)die()}}if(rageTime){rageTime--;if(!rageTime)hud()}camera.position.x+=(hero.position.x*.48-camera.position.x)*.08;camera.position.z+=(hero.position.z+7.3-camera.position.z)*.08;camera.lookAt(hero.position.x,2.15,hero.position.z-7);let boss=enemies.find(e=>e.type==='boss');if(boss){$('#bossbar').classList.remove('hidden');$('#bossbar i').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}else $('#bossbar').classList.add('hidden')}else if(state==='menu'){hero.rotation.y=Math.sin(performance.now()*.0007)*.12;camera.position.x=Math.sin(performance.now()*.00025)*2.1;camera.position.y=5.5;camera.position.z=10.5;camera.lookAt(0,2,-8)}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
