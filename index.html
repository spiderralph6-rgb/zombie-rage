<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="build" content="cinematic-v4"><title>Zombie Rage</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial Black,Arial}canvas{display:block;touch-action:none}#hud{position:fixed;top:10px;left:10px;right:10px;display:none;gap:8px;align-items:center;pointer-events:none}.panel{background:#090909d9;border:1px solid #7b3026;border-radius:8px;padding:7px 10px;box-shadow:0 0 15px #000}.hp{flex:1}.hp small,#weapon small{display:block;font:700 10px Arial;color:#bbb}.meter{height:9px;background:#250806;border:1px solid #6d2019;border-radius:8px;overflow:hidden;margin-top:3px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#e82419,#ff7b23)}#weapon{font:900 14px Arial;text-align:right}#bar{position:fixed;left:18px;right:100px;bottom:18px;height:20px;border:2px solid #ff3b20;border-radius:12px;display:none;overflow:hidden;background:#130403;box-shadow:0 0 10px #000}#fill{height:100%;width:0;background:linear-gradient(90deg,#ff9a19,#e52118)}#rageLabel{position:fixed;bottom:21px;left:28px;display:none;font:900 11px Arial;pointer-events:none}#fire{position:fixed;right:18px;bottom:12px;width:68px;height:68px;border-radius:50%;display:none;border:3px solid #ff5a2d;background:radial-gradient(circle,#c72c1d,#48100b);color:#fff;font-size:27px;box-shadow:0 0 22px #c31d15aa}#menu,#diff{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:18px;overflow:hidden;background:#080808}#diff{display:none;background:radial-gradient(circle,#2c1c16,#050505 70%)}#menu:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,transparent 0 12%,#0008 54%,#000 100%),repeating-linear-gradient(155deg,#170d09 0 3px,#090807 3px 80px);z-index:0}#menu:after{content:'';position:absolute;width:120%;height:45%;left:-10%;bottom:-8%;background:linear-gradient(175deg,transparent 0 18%,#35120d 19% 22%,#0a0807 23% 100%);box-shadow:0 -25px 60px #9f281955;z-index:0}.cover{position:relative;z-index:2;width:min(94vw,480px);height:94vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4vh}.moon{position:absolute;top:8%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff8b4b,#b82b1b 45%,#48100c 70%);box-shadow:0 0 80px #d52a1c88;z-index:-1}.heroPoster{width:190px;height:225px;object-fit:contain;filter:drop-shadow(0 12px 8px #000) drop-shadow(0 0 15px #d62c1b);margin-top:45px}.zleft,.zright{position:absolute;width:120px;height:150px;object-fit:contain;filter:brightness(.6) drop-shadow(0 8px 5px #000);top:25%}.zleft{left:-25px;transform:rotate(-18deg)}.zright{right:-25px;transform:rotate(20deg) scaleX(-1)}h1{font-size:clamp(58px,17vw,94px);line-height:.73;margin:-38px 0 0;color:#f2eee9;font-style:italic;letter-spacing:-5px;text-shadow:5px 7px 0 #68150e,0 0 24px #e62c1d}h1 span{color:#ef2e1e}.tag{font:900 13px Arial;letter-spacing:4px;color:#e4b7a7;margin:12px 0}.btn{border:1px solid #735145;border-radius:7px;padding:13px 24px;margin:5px;min-width:255px;font-weight:900;font-size:17px;background:linear-gradient(#342824,#141111);color:#fff;box-shadow:0 5px 14px #000}.play{background:linear-gradient(#ee442e,#8b170f);font-size:24px;border-color:#ff7657;box-shadow:0 0 25px #c51e1488}.difficulty{border-color:#d49b24}.cards{display:flex;gap:8px}.card{padding:18px 8px;border:2px solid;border-radius:8px;background:#101010;font-family:Arial}.easy{border-color:#71d52d}.normal{border-color:#eeb400}.hard{border-color:#d52d2d}.card b{display:block}.card span{font-size:11px;color:#bbb}.card button{margin-top:12px;padding:8px;border:0;border-radius:4px}#msg{position:fixed;top:38%;width:100%;text-align:center;font-size:42px;font-weight:900;text-shadow:0 4px 12px #000;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="hud"><div class="panel hp"><small id="stats"></small><div class="meter"><i id="hpfill"></i></div></div><div class="panel" id="weapon"></div></div><div id="bar"><div id="fill"></div></div><div id="rageLabel">RAGE</div><button id="fire">✹</button><div id="msg"></div><div id="menu"><div class="cover"><div class="moon"></div><img class="zleft" src="assets/brute.svg"><img class="zright" src="assets/zombie.svg"><img class="heroPoster" src="assets/hero.svg"><h1>ZOMBIE<br><span>RAGE</span></h1><div class="tag">NO MERCY. JUST SURVIVE.</div><button class="btn play" id="play">▶ ENTER THE DEAD ZONE</button><button class="btn difficulty" id="difficulty">☠ NORMAL</button><button class="btn" id="how">HOW TO PLAY</button><button class="btn" id="sound">SOUND: ON</button></div></div><div id="diff"><div><h2>CHOOSE DIFFICULTY</h2><div class="cards"><div class="card easy"><b>EASY</b><span>Slower infected</span><br><button data-d="easy">SELECT</button></div><div class="card normal"><b>NORMAL</b><span>Balanced carnage</span><br><button data-d="normal">SELECT</button></div><div class="card hard"><b>HARD</b><span>Relentless horde</span><br><button data-d="hard">SELECT</button></div></div><button class="btn" id="back">← BACK</button></div></div><script>const c=g,x=c.getContext('2d'),imgs={};for(const [k,v] of Object.entries({hero:'hero.svg',walker:'zombie.svg',runner:'runner.svg',tank:'brute.svg',boss:'boss.svg'})){imgs[k]=new Image();imgs[k].src='assets/'+v}let W,H,p,Z=[],B=[],FX=[],score=0,wave=0,kills=0,rage=0,rageTime=0,playing=0,soundOn=1,keys={},joy=null,shoot=null,lastShot=0,best=+localStorage.zrBest||0,level='normal';const cfg={easy:{speed:.76,damage:.65,hp:130,count:.8},normal:{speed:1,damage:1,hp:100,count:1},hard:{speed:1.28,damage:1.35,hp:85,count:1.25}},guns=[{n:'PISTOL',rate:260,s:13,spread:0},{n:'SHOTGUN',rate:650,s:12,spread:.25,pel:5},{n:'ASSAULT RIFLE',rate:125,s:15,spread:.04},{n:'HEAVY',rate:85,s:14,spread:.09}];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();function tone(f,d=.05){if(!soundOn)return;try{let a=new AudioContext,o=a.createOscillator(),v=a.createGain();o.frequency.value=f;v.gain.value=.035;o.connect(v);v.connect(a.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function start(){menu.style.display='none';p={x:W/2,y:H/2,hp:cfg[level].hp,max:cfg[level].hp,weapon:0,a:0};Z=[];B=[];FX=[];score=wave=kills=rage=rageTime=0;playing=1;hud.style.display='flex';bar.style.display=rageLabel.style.display=fire.style.display='block';nextWave()}function nextWave(){wave++;msg.textContent=wave%5===0?'☠ BOSS WAVE ☠':'WAVE '+wave;setTimeout(()=>msg.textContent='',900);let n=Math.ceil((4+wave*2)*cfg[level].count);for(let i=0;i<n;i++)spawn();if(wave%5===0)spawn('boss');if(wave===3)p.weapon=1;if(wave===6)p.weapon=2;if(wave===9)p.weapon=3}function spawn(force){let s=Math.floor(Math.random()*4),type=force||(wave>5&&Math.random()<.15?'tank':wave>2&&Math.random()<.28?'runner':'walker'),q={type,r:22,hp:2,sp:.62*cfg[level].speed,dmg:.22*cfg[level].damage,phase:Math.random()*6};if(type==='runner'){q.r=18;q.hp=1;q.sp=1.2*cfg[level].speed}if(type==='tank'){q.r=34;q.hp=8;q.sp=.4*cfg[level].speed;q.dmg=.5*cfg[level].damage}if(type==='boss'){q.r=52;q.hp=34+wave*2;q.sp=.46*cfg[level].speed;q.dmg=.8*cfg[level].damage}if(s===0){q.x=Math.random()*W;q.y=-80}else if(s===1){q.x=W+80;q.y=Math.random()*H}else if(s===2){q.x=Math.random()*W;q.y=H+80}else{q.x=-80;q.y=Math.random()*H}Z.push(q)}function fireAt(tx,ty){let w=guns[p.weapon],now=performance.now();if(now-lastShot<w.rate)return;lastShot=now;p.a=Math.atan2(ty-p.y,tx-p.x);for(let i=0;i<(w.pel||1);i++){let a=p.a+(Math.random()-.5)*w.spread*2;B.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,vx:Math.cos(a)*w.s,vy:Math.sin(a)*w.s})}FX.push({x:p.x+Math.cos(p.a)*38,y:p.y+Math.sin(p.a)*38,l:5,flash:1});tone(150,.035)}function kill(q){q.dead=1;kills++;score+=q.type==='boss'?500:q.type==='tank'?40:10;rage=Math.min(100,rage+(q.type==='boss'?40:8));for(let i=0;i<20;i++)FX.push({x:q.x,y:q.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:45,blood:1});tone(55,.09)}function activate(){if(rage>=100&&!rageTime){rage=0;rageTime=480;msg.textContent='RAGE!';setTimeout(()=>msg.textContent='',600)}}function end(){playing=0;best=Math.max(best,score);localStorage.zrBest=best;hud.style.display=bar.style.display=rageLabel.style.display=fire.style.display='none';menu.style.display='grid';menu.querySelector('h1').innerHTML='GAME<br><span>OVER</span>';menu.querySelector('.tag').textContent=`SCORE ${score} • WAVE ${wave} • KILLS ${kills} • BEST ${best}`;play.textContent='↻ FIGHT AGAIN'}play.onclick=start;difficulty.onclick=()=>{menu.style.display='none';diff.style.display='grid'};back.onclick=()=>{diff.style.display='none';menu.style.display='grid'};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{level=b.dataset.d;document.querySelector('#difficulty').textContent='☠ '+level.toUpperCase();diff.style.display='none';menu.style.display='grid'});sound.onclick=e=>{soundOn=!soundOn;e.target.textContent='SOUND: '+(soundOn?'ON':'OFF')};how.onclick=()=>alert('LEFT THUMB: move. RIGHT SIDE / FIRE: aim and shoot. Tap RAGE bar when full. Survive waves, unlock weapons, destroy bosses.');onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')activate()};onkeyup=e=>keys[e.key.toLowerCase()]=0;c.onpointerdown=e=>{if(!playing)return;c.setPointerCapture(e.pointerId);if(e.clientX<W*.48)joy={id:e.pointerId,cx:e.clientX,cy:e.clientY,x:e.clientX,y:e.clientY};else shoot={id:e.pointerId,x:e.clientX,y:e.clientY}};c.onpointermove=e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}if(shoot&&shoot.id===e.pointerId){shoot.x=e.clientX;shoot.y=e.clientY}};c.onpointerup=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(shoot&&shoot.id===e.pointerId)shoot=null};bar.onclick=activate;fire.onpointerdown=e=>{e.stopPropagation();let q=Z.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a,Z[0]);if(q)fireAt(q.x,q.y)};function ground(){let grd=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H));grd.addColorStop(0,'#2b2520');grd.addColorStop(1,'#090807');x.fillStyle=grd;x.fillRect(0,0,W,H);x.fillStyle='#171412';for(let y=100;y<H;y+=190)x.fillRect(0,y,W,5);for(let i=0;i<9;i++){let px=(i*193+30)%W,py=(i*283+90)%H;x.fillStyle='#0e0d0c';x.fillRect(px-30,py-10,60,20);x.fillRect(px-8,py-32,16,64)}x.fillStyle='#35100c88';for(let i=0;i<8;i++){x.beginPath();x.arc((i*151)%W,(i*317)%H,10+i%3*5,0,7);x.fill()}x.fillStyle='#422015';for(let i=0;i<5;i++){let px=(i*229+80)%W,py=(i*173+180)%H;x.save();x.translate(px,py);x.rotate(i*.7);x.fillRect(-28,-12,56,24);x.fillStyle='#100f0e';x.fillRect(-20,-16,13,7);x.fillRect(8,-16,13,7);x.restore()}}function drawHero(){x.save();x.translate(p.x,p.y);x.rotate(p.a+Math.PI/2);if(rageTime){x.shadowBlur=32;x.shadowColor='#ff3824'}x.drawImage(imgs.hero,-47,-53,94,106);x.restore()}function drawZombie(q){x.save();x.translate(q.x,q.y);x.rotate(Math.atan2(p.y-q.y,p.x-q.x)+Math.PI/2);let bob=Math.sin(performance.now()/120+q.phase)*2,sz=q.type==='boss'?132:q.type==='tank'?96:q.type==='runner'?62:72;x.globalAlpha=.35;x.fillStyle='#000';x.beginPath();x.ellipse(0,28,sz*.3,sz*.12,0,0,7);x.fill();x.globalAlpha=1;x.drawImage(imgs[q.type],-sz/2,-sz/2+bob,sz,sz*1.12);x.restore()}function loop(){requestAnimationFrame(loop);ground();if(!playing)return;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/48);mx=dx/d*s;my=dy/d*s}let md=Math.hypot(mx,my)||1;if(mx||my){p.x+=mx/md*(rageTime?5.7:4);p.y+=my/md*(rageTime?5.7:4)}p.x=Math.max(45,Math.min(W-45,p.x));p.y=Math.max(65,Math.min(H-80,p.y));if(shoot){p.a=Math.atan2(shoot.y-p.y,shoot.x-p.x);fireAt(shoot.x,shoot.y)}for(const b of B){b.x+=b.vx;b.y+=b.vy;for(const q of Z)if(!b.dead&&Math.hypot(b.x-q.x,b.y-q.y)<q.r+5){b.dead=1;q.hp-=rageTime?3:1;if(q.hp<=0)kill(q)}}B=B.filter(b=>!b.dead&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const q of Z){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;q.x+=dx/d*q.sp;q.y+=dy/d*q.sp;if(d<q.r+25){if(rageTime){q.hp-=.2;q.x-=dx/d*8;q.y-=dy/d*8;if(q.hp<=0)kill(q)}else{p.hp-=q.dmg;if(p.hp<=0)end()}}}Z=Z.filter(q=>!q.dead);if(!Z.length)nextWave();Z.forEach(drawZombie);drawHero();x.fillStyle='#ffd45b';x.shadowBlur=9;x.shadowColor='#ff8a00';for(const b of B){x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}x.shadowBlur=0;for(const f of FX){if(f.flash){x.fillStyle='#fff2a0';x.beginPath();x.arc(f.x,f.y,12-f.l,0,7);x.fill()}else{f.x+=f.vx;f.y+=f.vy;f.vx*=.94;f.vy*=.94;x.fillStyle='#7d160f';x.beginPath();x.arc(f.x,f.y,4,0,7);x.fill()}f.l--}FX=FX.filter(f=>f.l>0);if(rageTime)rageTime--;if(joy){x.strokeStyle='#ffffff66';x.lineWidth=4;x.beginPath();x.arc(joy.cx,joy.cy,45,0,7);x.stroke();x.beginPath();x.arc(joy.x,joy.y,19,0,7);x.stroke()}stats.textContent=`HP ${Math.max(0,Math.ceil(p.hp))}/${p.max} • WAVE ${wave} • SCORE ${score}`;hpfill.style.width=Math.max(0,p.hp/p.max*100)+'%';weapon.innerHTML=`<small>WEAPON</small>${guns[p.weapon].n} • ${kills} KILLS`;fill.style.width=(rageTime?100:rage)+'%';bar.style.boxShadow=rage>=100?'0 0 24px #ff3b20':'0 0 10px #000'}loop();</script></body></html>
