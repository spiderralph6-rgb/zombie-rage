<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zombie Rage</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100a;color:white;font-family:Arial}canvas{display:block;touch-action:none}#hud{position:fixed;top:10px;left:12px;right:12px;display:none;justify-content:space-between;font-weight:bold;text-shadow:0 2px 3px #000;pointer-events:none}#bar{position:fixed;left:12px;right:12px;bottom:12px;height:14px;border:2px solid #9cff43;border-radius:10px;display:none;overflow:hidden}#fill{height:100%;width:0;background:#76ff38}#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#18321d,#030704);text-align:center;padding:20px}h1{font-size:clamp(52px,15vw,100px);margin:0;color:#8cff45;text-shadow:0 5px 0 #214d19,0 0 28px #54ff2b}p{color:#ccc}button{border:0;border-radius:14px;padding:15px 30px;margin:6px;font-weight:900;font-size:18px;background:#77e53c;color:#07100a}.small{background:#263428;color:white}#msg{position:fixed;top:42%;width:100%;text-align:center;font-size:42px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="hud"><span id="stats"></span><span id="weapon"></span></div><div id="bar"><div id="fill"></div></div><div id="msg"></div><div id="menu"><div><h1>ZOMBIE<br>RAGE</h1><p>Survive. Kill. Rage.</p><button id="play">PLAY</button><br><button class="small" id="how">HOW TO PLAY</button><button class="small" id="sound">SOUND: ON</button><p id="help">Mobile: left thumb moves • right thumb aims & shoots<br>Desktop: WASD + mouse • SPACE activates Rage</p></div></div><script>
const c=document.querySelector('#g'),x=c.getContext('2d'),hud=document.querySelector('#hud'),stats=document.querySelector('#stats'),wep=document.querySelector('#weapon'),bar=document.querySelector('#bar'),fill=document.querySelector('#fill'),menu=document.querySelector('#menu'),msg=document.querySelector('#msg');let W,H,p,Z=[],B=[],P=[],score=0,wave=0,kills=0,rage=0,rageTime=0,playing=false,soundOn=true,keys={},joy=null,shoot=null,lastShot=0,best=+localStorage.zrBest||0;const weapons=[{n:'PISTOL',rate:260,d:1,s:12,spread:0},{n:'SHOTGUN',rate:650,d:1,s:11,spread:.24,pel:5},{n:'RIFLE',rate:125,d:1,s:14,spread:.04},{n:'HEAVY',rate:85,d:1,s:13,spread:.09}];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();function tone(f,d=.05){if(!soundOn)return;try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function start(){menu.style.display='none';hud.style.display='flex';bar.style.display='block';p={x:W/2,y:H/2,hp:100,weapon:0};Z=[];B=[];P=[];score=0;wave=0;kills=0;rage=0;rageTime=0;playing=true;nextWave()}function nextWave(){wave++;msg.textContent=wave%5===0?'BOSS WAVE':'WAVE '+wave;setTimeout(()=>msg.textContent='',1100);let n=5+wave*2;for(let i=0;i<n;i++)spawn();if(wave%5===0)spawn('boss');if(wave===3)p.weapon=1;if(wave===6)p.weapon=2;if(wave===9)p.weapon=3}function spawn(force){let side=Math.floor(Math.random()*4),type=force||(wave>5&&Math.random()<.13?'tank':wave>2&&Math.random()<.22?'runner':'walker'),q={type,r:18,hp:1,sp:.7,dmg:.25};if(type==='runner'){q.r=13;q.sp=1.35}if(type==='tank'){q.r=27;q.hp=5;q.sp=.42;q.dmg=.5}if(type==='boss'){q.r=48;q.hp=25+wave*2;q.sp=.5;q.dmg=.8}if(side===0){q.x=Math.random()*W;q.y=-60}else if(side===1){q.x=W+60;q.y=Math.random()*H}else if(side===2){q.x=Math.random()*W;q.y=H+60}else{q.x=-60;q.y=Math.random()*H}Z.push(q)}function fire(tx,ty){let w=weapons[p.weapon],now=performance.now();if(now-lastShot<w.rate)return;lastShot=now;let dx=tx-p.x,dy=ty-p.y,a=Math.atan2(dy,dx),count=w.pel||1;for(let i=0;i<count;i++){let aa=a+(Math.random()-.5)*w.spread*2;B.push({x:p.x,y:p.y,vx:Math.cos(aa)*w.s,vy:Math.sin(aa)*w.s,d:w.d})}tone(p.weapon===1?100:180,.04)}function boom(q){kills++;score+=q.type==='boss'?500:q.type==='tank'?30:10;rage=Math.min(100,rage+(q.type==='boss'?40:8));for(let i=0;i<8;i++)P.push({x:q.x,y:q.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:30});if(Math.random()<.07)P.push({x:q.x,y:q.y,pick:'health',l:500});tone(70,.08)}function activate(){if(rage>=100&&!rageTime){rage=0;rageTime=480;msg.textContent='RAGE!';setTimeout(()=>msg.textContent='',700);tone(60,.3)}}function end(){playing=false;best=Math.max(best,score);localStorage.zrBest=best;menu.style.display='grid';hud.style.display='none';bar.style.display='none';menu.querySelector('h1').innerHTML='GAME OVER';menu.querySelector('p').textContent='Score '+score+' • Wave '+wave+' • Kills '+kills+' • Best '+best;document.querySelector('#play').textContent='PLAY AGAIN'}document.querySelector('#play').onclick=start;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.target.textContent='SOUND: '+(soundOn?'ON':'OFF')};document.querySelector('#how').onclick=()=>alert('SURVIVE THE HORDE!\n\nMobile: drag left side to move, hold/drag right side to shoot. Tap the glowing RAGE bar at 100%.\n\nDesktop: WASD/Arrows move, mouse shoots, SPACE activates Rage.\n\nNew weapons unlock as waves increase. Boss every 5 waves.');onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')activate()};onkeyup=e=>keys[e.key.toLowerCase()]=0;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);if(e.clientX<W*.45)joy={id:e.pointerId,cx:e.clientX,cy:e.clientY,x:e.clientX,y:e.clientY};else{shoot={id:e.pointerId,x:e.clientX,y:e.clientY};fire(e.clientX,e.clientY)}};c.onpointermove=e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}if(shoot&&shoot.id===e.pointerId){shoot.x=e.clientX;shoot.y=e.clientY}};c.onpointerup=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(shoot&&shoot.id===e.pointerId)shoot=null};bar.onclick=activate;c.onmousedown=e=>{if(playing&&e.clientX>W*.45)shoot={id:'mouse',x:e.clientX,y:e.clientY}};onmouseup=()=>{if(shoot&&shoot.id==='mouse')shoot=null};onmousemove=e=>{if(shoot&&shoot.id==='mouse'){shoot.x=e.clientX;shoot.y=e.clientY}};function loop(){requestAnimationFrame(loop);x.fillStyle='#0d1710';x.fillRect(0,0,W,H);x.strokeStyle='#18271b';for(let i=0;i<W;i+=70){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=70){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}if(!playing)return;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/45);mx=dx/d*s;my=dy/d*s}let ps=rageTime?5.8:4.1,d=Math.hypot(mx,my)||1;if(mx||my){p.x+=mx/d*ps;p.y+=my/d*ps}p.x=Math.max(24,Math.min(W-24,p.x));p.y=Math.max(24,Math.min(H-24,p.y));if(shoot)fire(shoot.x,shoot.y);for(const b of B){b.x+=b.vx;b.y+=b.vy;for(const q of Z)if(!b.dead&&Math.hypot(b.x-q.x,b.y-q.y)<q.r+4){b.dead=1;q.hp-=rageTime?3:b.d;if(q.hp<=0){q.dead=1;boom(q)}}}B=B.filter(b=>!b.dead&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const q of Z){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;q.x+=dx/d*q.sp;q.y+=dy/d*q.sp;if(d<q.r+22){if(rageTime){q.hp-=.25;q.x-=dx/d*8;q.y-=dy/d*8;if(q.hp<=0){q.dead=1;boom(q)}}else{p.hp-=q.dmg;if(p.hp<=0)end()}}}Z=Z.filter(q=>!q.dead);if(!Z.length)nextWave();for(const a of P){if(a.pick){if(Math.hypot(a.x-p.x,a.y-p.y)<30){p.hp=Math.min(100,p.hp+30);a.l=0;tone(600,.1)}}else{a.x+=a.vx;a.y+=a.vy;a.vx*=.95;a.vy*=.95}a.l--}P=P.filter(a=>a.l>0);if(rageTime)rageTime--;x.save();x.translate(p.x,p.y);x.fillStyle=rageTime?'#d8ff42':'#54c34a';x.beginPath();x.arc(0,0,22,0,7);x.fill();x.fillStyle='#263221';x.fillRect(-18,8,36,24);x.restore();for(const q of Z){x.fillStyle=q.type==='boss'?'#b02b2b':q.type==='tank'?'#596a46':q.type==='runner'?'#94a96e':'#718657';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.fillStyle='#ff3030';x.fillRect(q.x-8,q.y-6,5,4);x.fillRect(q.x+3,q.y-6,5,4);if(q.type==='boss'){x.fillStyle='#0008';x.fillRect(q.x-45,q.y-q.r-14,90,7);x.fillStyle='#e33';x.fillRect(q.x-45,q.y-q.r-14,90*Math.max(0,q.hp/(25+wave*2)),7)}}x.fillStyle='#ffd84d';for(const b of B){x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}for(const a of P){x.fillStyle=a.pick?'#58ff77':'#7b1515';x.beginPath();x.arc(a.x,a.y,a.pick?10:3,0,7);x.fill()}if(joy){x.strokeStyle='#ffffff55';x.lineWidth=4;x.beginPath();x.arc(joy.cx,joy.cy,38,0,7);x.stroke();x.beginPath();x.arc(joy.x,joy.y,17,0,7);x.stroke()}stats.textContent='❤ '+Math.max(0,Math.ceil(p.hp))+'  SCORE '+score+'  WAVE '+wave;wep.textContent=weapons[p.weapon].n+' • KILLS '+kills;fill.style.width=(rageTime?100:rage)+'%';bar.style.boxShadow=rage>=100?'0 0 22px #76ff38':'none'}loop();</script></body></html>
