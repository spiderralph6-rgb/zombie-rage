<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zombie Rage</title><style>*{box-sizing:border-box}body{margin:0;background:#08100b;color:#fff;font-family:Arial;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}#tip{position:fixed;bottom:12px;width:100%;text-align:center;font-size:13px;opacity:.7;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="hud"><span id="s"></span><span id="r"></span></div><div id="tip">DRAG left side to move • TAP/DRAG right side to shoot • RAGE activates at 100%</div><script>const c=document.querySelector('#g'),x=c.getContext('2d'),S=document.querySelector('#s'),R=document.querySelector('#r');let W,H,p,Z=[],B=[],score,wave,rage,over,joy=null,aim={x:1,y:0};function rs(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=rs;rs();function reset(){p={x:W/2,y:H/2,hp:100};Z=[];B=[];score=0;wave=1;rage=0;over=false;spawn()}function spawn(){for(let i=0;i<4+wave*2;i++){let side=Math.floor(Math.random()*4),q={r:17+Math.random()*5,hp:1+Math.floor(wave/4),sp:.65+wave*.055};if(side===0){q.x=Math.random()*W;q.y=-30}else if(side===1){q.x=W+30;q.y=Math.random()*H}else if(side===2){q.x=Math.random()*W;q.y=H+30}else{q.x=-30;q.y=Math.random()*H}Z.push(q)}}function shot(tx,ty){let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;aim={x:dx/d,y:dy/d};B.push({x:p.x+aim.x*28,y:p.y+aim.y*28,vx:aim.x*11,vy:aim.y*11})}c.onpointerdown=e=>{if(over){reset();return}if(e.clientX<W*.48)joy={id:e.pointerId,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY};else shot(e.clientX,e.clientY)};c.onpointermove=e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}else if(e.buttons&&e.clientX>W*.48)shot(e.clientX,e.clientY)};c.onpointerup=e=>{if(joy&&e.pointerId===joy.id)joy=null};function loop(){x.fillStyle='#101a12';x.fillRect(0,0,W,H);x.strokeStyle='#17271a';x.lineWidth=1;for(let i=0;i<W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}if(!over){if(joy){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy)||1,sp=Math.min(4.5,d/12);p.x+=dx/d*sp;p.y+=dy/d*sp}p.x=Math.max(25,Math.min(W-25,p.x));p.y=Math.max(25,Math.min(H-25,p.y));for(const q of Z){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;q.x+=dx/d*q.sp;q.y+=dy/d*q.sp;if(d<40){if(rage>=100){q.hp=0;score+=20}else{p.hp-=.32;if(p.hp<=0)over=true}}}for(const u of B){u.x+=u.vx;u.y+=u.vy;for(const q of Z)if(!u.dead&&Math.hypot(u.x-q.x,u.y-q.y)<q.r+4){u.dead=1;q.hp--;if(q.hp<=0){score+=10;rage=Math.min(100,rage+9)}}}Z=Z.filter(q=>q.hp>0);B=B.filter(u=>!u.dead&&u.x>0&&u.x<W&&u.y>0&&u.y<H);if(!Z.length){wave++;spawn()}if(rage>=100)rage-=.16}x.save();x.translate(p.x,p.y);x.rotate(Math.atan2(aim.y,aim.x));x.fillStyle=rage>=100?'#9cff43':'#54b948';x.beginPath();x.arc(0,0,23,0,7);x.fill();x.fillStyle='#28301f';x.fillRect(-18,8,36,23);x.fillStyle='#aaa';x.fillRect(12,-5,32,9);x.restore();for(const q of Z){x.fillStyle='#718657';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.fillStyle='#9b2020';x.fillRect(q.x-7,q.y-6,4,4);x.fillRect(q.x+3,q.y-6,4,4)}x.fillStyle='#ffd84d';for(const u of B){x.beginPath();x.arc(u.x,u.y,4,0,7);x.fill()}if(joy){x.strokeStyle='#ffffff55';x.lineWidth=4;x.beginPath();x.arc(joy.cx,joy.cy,35,0,7);x.stroke();x.beginPath();x.arc(joy.x,joy.y,16,0,7);x.stroke()}S.textContent='❤ '+Math.max(0,Math.ceil(p.hp))+'  SCORE '+score+'  WAVE '+wave;R.textContent='RAGE '+Math.floor(rage)+'%';if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 42px Arial';x.fillText('GAME OVER',W/2,H/2-25);x.font='22px Arial';x.fillText('Score '+score+' • Tap to restart',W/2,H/2+20)}requestAnimationFrame(loop)}reset();loop();</script></body></html>
