<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zombie Rage</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b09;color:#fff;font-family:Arial Black,Arial}canvas{display:block;touch-action:none}#hud{position:fixed;top:8px;left:10px;right:10px;display:none;justify-content:space-between;font-size:14px;text-shadow:0 2px 4px #000;pointer-events:none}#bar{position:fixed;left:12px;right:12px;bottom:12px;height:17px;border:2px solid #80ff27;border-radius:8px;display:none;overflow:hidden;background:#111}#fill{height:100%;width:0;background:linear-gradient(90deg,#ffb000,#aaff22)}#menu,#diff{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#27301d,#070907 65%);text-align:center;padding:20px}#diff{display:none}h1{font-size:clamp(58px,16vw,110px);line-height:.8;margin:0;color:#a1ff27;font-style:italic;text-shadow:3px 5px 0 #243b11,0 0 28px #61ff1c}p{color:#ccc;font-family:Arial}.btn{border:1px solid #53624a;border-radius:6px;padding:15px 26px;margin:6px;min-width:230px;font-weight:900;font-size:18px;background:linear-gradient(#263326,#141914);color:#fff}.play{background:linear-gradient(#65c52b,#247b12);font-size:25px}.difficulty{border-color:#e3a900}.cards{display:flex;gap:10px;max-width:700px}.card{flex:1;min-width:95px;padding:18px 8px;border:2px solid;border-radius:8px;background:#101310;font-family:Arial}.easy{border-color:#71d52d}.normal{border-color:#eeb400}.hard{border-color:#d52d2d}.card b{display:block;font-size:22px;margin-bottom:12px}.card span{font-size:12px;color:#bbb}.card button{margin-top:15px;width:100%;padding:10px;border:0;border-radius:5px;font-weight:bold}.easy button{background:#63c52b}.normal button{background:#eeb400}.hard button{background:#d52d2d;color:#fff}#msg{position:fixed;top:42%;width:100%;text-align:center;font-size:38px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="hud"><span id="stats"></span><span id="weapon"></span></div><div id="bar"><div id="fill"></div></div><div id="msg"></div><div id="menu"><div><h1>ZOMBIE<br>RAGE</h1><p>Survive. Kill. Rage.</p><button class="btn play" id="play">▶ PLAY</button><br><button class="btn difficulty" id="difficulty">☠ DIFFICULTY: NORMAL</button><br><button class="btn" id="how">▣ HOW TO PLAY</button><br><button class="btn" id="sound">⚙ SOUND: ON</button></div></div><div id="diff"><div><h2>CHOOSE DIFFICULTY</h2><div class="cards"><div class="card easy"><b>EASY</b><span>Slower zombies<br>More health</span><button data-d="easy">SELECT</button></div><div class="card normal"><b>NORMAL</b><span>Balanced challenge<br>for most players</span><button data-d="normal">SELECT</button></div><div class="card hard"><b>HARD</b><span>Faster zombies<br>Real challenge</span><button data-d="hard">SELECT</button></div></div><button class="btn" id="back">← BACK</button></div></div><script>const c=document.querySelector('#g'),x=c.getContext('2d'),hud=document.querySelector('#hud'),stats=document.querySelector('#stats'),wep=document.querySelector('#weapon'),bar=document.querySelector('#bar'),fill=document.querySelector('#fill'),menu=document.querySelector('#menu'),diff=document.querySelector('#diff'),msg=document.querySelector('#msg');let W,H,p,Z=[],B=[],P=[],score=0,wave=0,kills=0,rage=0,rageTime=0,playing=false,soundOn=true,keys={},joy=null,shoot=null,lastShot=0,best=+localStorage.zrBest||0,difficulty='normal';const cfg={easy:{speed:.78,damage:.65,hp:130,count:.8},normal:{speed:1,damage:1,hp:100,count:1},hard:{speed:1.28,damage:1.35,hp:85,count:1.25}},weapons=[{n:'PISTOL',rate:260,d:1,s:12,spread:0},{n:'SHOTGUN',rate:650,d:1,s:11,spread:.24,pel:5},{n:'ASSAULT RIFLE',rate:125,d:1,s:14,spread:.04},{n:'HEAVY',rate:85,d:1,s:13,spread:.09}];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();function tone(f,d=.05){if(!soundOn)return;try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function start(){menu.style.display='none';p={x:W/2,y:H/2,hp:cfg[difficulty].hp,weapon:0,max:cfg[difficulty].hp};Z=[];B=[];P=[];score=wave=kills=rage=rageTime=0;playing=true;hud.style.display='flex';bar.style.display='block';nextWave()}function nextWave(){wave++;msg.textContent=wave%5===0?'☠ BOSS WAVE ☠':'WAVE '+wave;setTimeout(()=>msg.textContent='',1000);let n=Math.ceil((5+wave*2)*cfg[difficulty].count);for(let i=0;i<n;i++)spawn();if(wave%5===0)spawn('boss');if(wave===3)p.weapon=1;if(wave===6)p.weapon=2;if(wave===9)p.weapon=3}function spawn(force){let side=Math.floor(Math.random()*4),type=force||(wave>5&&Math.random()<.13?'tank':wave>2&&Math.random()<.22?'runner':'walker'),q={type,r:18,hp:1,sp:.7*cfg[difficulty].speed,dmg:.25*cfg[difficulty].damage};if(type==='runner'){q.r=14;q.sp=1.35*cfg[difficulty].speed}if(type==='tank'){q.r=30;q.hp=5;q.sp=.42*cfg[difficulty].speed;q.dmg=.5*cfg[difficulty].damage}if(type==='boss'){q.r=52;q.hp=25+wave*2;q.sp=.5*cfg[difficulty].speed;q.dmg=.8*cfg[difficulty].damage}if(side===0){q.x=Math.random()*W;q.y=-60}else if(side===1){q.x=W+60;q.y=Math.random()*H}else if(side===2){q.x=Math.random()*W;q.y=H+60}else{q.x=-60;q.y=Math.random()*H}Z.push(q)}function fire(tx,ty){let w=weapons[p.weapon],now=performance.now();if(now-lastShot<w.rate)return;lastShot=now;let a=Math.atan2(ty-p.y,tx-p.x),count=w.pel||1;for(let i=0;i<count;i++){let aa=a+(Math.random()-.5)*w.spread*2;B.push({x:p.x,y:p.y,vx:Math.cos(aa)*w.s,vy:Math.sin(aa)*w.s,d:w.d})}tone(160,.035)}function boom(q){kills++;score+=q.type==='boss'?500:q.type==='tank'?30:10;rage=Math.min(100,rage+(q.type==='boss'?40:8));for(let i=0;i<10;i++)P.push({x:q.x,y:q.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:35});if(Math.random()<.07)P.push({x:q.x,y:q.y,pick:1,l:500});tone(65,.08)}function activate(){if(rage>=100&&!rageTime){rage=0;rageTime=480;msg.textContent='RAGE!';setTimeout(()=>msg.textContent='',650)}}function end(){playing=false;best=Math.max(best,score);localStorage.zrBest=best;hud.style.display=bar.style.display='none';menu.style.display='grid';menu.querySelector('h1').innerHTML='GAME<br>OVER';menu.querySelector('p').textContent=`Score ${score} • Wave ${wave} • Kills ${kills} • Best ${best}`;play.textContent='↻ PLAY AGAIN'}play.onclick=start;difficulty.onclick=()=>{menu.style.display='none';diff.style.display='grid'};back.onclick=()=>{diff.style.display='none';menu.style.display='grid'};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.d;document.querySelector('#difficulty').textContent='☠ DIFFICULTY: '+difficulty.toUpperCase();diff.style.display='none';menu.style.display='grid'});sound.onclick=e=>{soundOn=!soundOn;e.target.textContent='⚙ SOUND: '+(soundOn?'ON':'OFF')};how.onclick=()=>alert('Mobile: left thumb moves. Right thumb aims and shoots. Tap the RAGE bar when full. New weapons unlock as waves rise. Boss every 5 waves.');onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')activate()};onkeyup=e=>keys[e.key.toLowerCase()]=0;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);if(e.clientX<W*.45)joy={id:e.pointerId,cx:e.clientX,cy:e.clientY,x:e.clientX,y:e.clientY};else shoot={id:e.pointerId,x:e.clientX,y:e.clientY}};c.onpointermove=e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}if(shoot&&shoot.id===e.pointerId){shoot.x=e.clientX;shoot.y=e.clientY}};c.onpointerup=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(shoot&&shoot.id===e.pointerId)shoot=null};bar.onclick=activate;function player(){x.save();x.translate(p.x,p.y);if(rageTime){x.shadowBlur=25;x.shadowColor='#9cff20'}x.fillStyle='#151515';x.fillRect(-14,14,28,24);x.fillStyle='#4b8f32';x.beginPath();x.arc(0,3,20,0,7);x.fill();x.fillStyle='#69b43c';x.beginPath();x.arc(-17,7,9,0,7);x.arc(17,7,9,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(0,-10,13,0,7);x.fill();x.fillStyle='#70b942';x.fillRect(-10,-9,20,15);x.fillStyle='#0b0b0b';x.fillRect(-7,-4,4,3);x.fillRect(3,-4,4,3);x.fillStyle='#333';x.fillRect(12,0,27,6);x.restore()}function zombie(q){x.save();x.translate(q.x,q.y);x.fillStyle=q.type==='boss'?'#5b6b37':q.type==='tank'?'#687249':'#747d52';x.beginPath();x.arc(0,0,q.r,0,7);x.fill();x.fillStyle='#3c422f';x.fillRect(-q.r*.55,q.r*.5,q.r*1.1,q.r*.8);x.fillStyle='#ff2929';x.fillRect(-9,-7,6,4);x.fillRect(3,-7,6,4);x.strokeStyle='#2b211b';x.lineWidth=3;x.beginPath();x.moveTo(-8,8);x.lineTo(8,11);x.stroke();x.restore()}function loop(){requestAnimationFrame(loop);x.fillStyle='#11130f';x.fillRect(0,0,W,H);x.strokeStyle='#25271f';x.lineWidth=2;for(let i=-H;i<W;i+=100){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke()}if(!playing)return;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/45);mx=dx/d*s;my=dy/d*s}let d=Math.hypot(mx,my)||1;if(mx||my){p.x+=mx/d*(rageTime?5.8:4.1);p.y+=my/d*(rageTime?5.8:4.1)}p.x=Math.max(25,Math.min(W-25,p.x));p.y=Math.max(25,Math.min(H-25,p.y));if(shoot)fire(shoot.x,shoot.y);for(const b of B){b.x+=b.vx;b.y+=b.vy;for(const q of Z)if(!b.dead&&Math.hypot(b.x-q.x,b.y-q.y)<q.r+4){b.dead=1;q.hp-=rageTime?3:b.d;if(q.hp<=0){q.dead=1;boom(q)}}}B=B.filter(b=>!b.dead&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const q of Z){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;q.x+=dx/d*q.sp;q.y+=dy/d*q.sp;if(d<q.r+22){if(rageTime){q.hp-=.25;q.x-=dx/d*8;q.y-=dy/d*8;if(q.hp<=0){q.dead=1;boom(q)}}else{p.hp-=q.dmg;if(p.hp<=0)end()}}}Z=Z.filter(q=>!q.dead);if(!Z.length)nextWave();for(const a of P){if(a.pick&&Math.hypot(a.x-p.x,a.y-p.y)<30){p.hp=Math.min(p.max,p.hp+30);a.l=0}else if(!a.pick){a.x+=a.vx;a.y+=a.vy;a.vx*=.95;a.vy*=.95}a.l--}P=P.filter(a=>a.l>0);if(rageTime)rageTime--;player();Z.forEach(zombie);x.fillStyle='#ffbd22';for(const b of B){x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}for(const a of P){x.fillStyle=a.pick?'#4dff69':'#711';x.beginPath();x.arc(a.x,a.y,a.pick?11:3,0,7);x.fill()}if(joy){x.strokeStyle='#ffffff66';x.lineWidth=4;x.beginPath();x.arc(joy.cx,joy.cy,42,0,7);x.stroke();x.beginPath();x.arc(joy.x,joy.y,18,0,7);x.stroke()}stats.textContent=`HP ${Math.max(0,Math.ceil(p.hp))}/${p.max}  •  WAVE ${wave}  •  SCORE ${score}`;wep.textContent=`${weapons[p.weapon].n}  •  KILLS ${kills}`;fill.style.width=(rageTime?100:rage)+'%';bar.style.boxShadow=rage>=100?'0 0 22px #aaff22':'none'}loop();</script></body></html>
