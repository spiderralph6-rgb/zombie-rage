<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="build" content="illustrated-v3"><title>Zombie Rage</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial Black,Arial}canvas{display:block;touch-action:none}#hud{position:fixed;top:8px;left:12px;right:12px;display:none;justify-content:space-between;font:700 14px Arial;text-shadow:0 2px 5px #000;pointer-events:none}#bar{position:fixed;left:18px;right:18px;bottom:14px;height:18px;border:2px solid #ff3b20;border-radius:10px;display:none;overflow:hidden;background:#100}#fill{height:100%;width:0;background:linear-gradient(90deg,#ff9a19,#e52118)}#menu,#diff{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 24%,#2a211b,#080808 68%);text-align:center;padding:20px}#diff{display:none}h1{font-size:clamp(58px,16vw,110px);line-height:.78;margin:0;color:#eee;font-style:italic;text-shadow:4px 6px 0 #64130d,0 0 30px #d52a1c}h1 span{color:#e52b1d}.btn{border:1px solid #5d5148;border-radius:7px;padding:15px 26px;margin:7px;min-width:250px;font-weight:900;font-size:18px;background:linear-gradient(#302b28,#151414);color:#fff}.play{background:linear-gradient(#d93627,#811710);font-size:25px}.difficulty{border-color:#d49b24}.cards{display:flex;gap:10px;max-width:700px}.card{flex:1;min-width:95px;padding:18px 8px;border:2px solid;border-radius:8px;background:#101010;font-family:Arial}.easy{border-color:#71d52d}.normal{border-color:#eeb400}.hard{border-color:#d52d2d}.card b{display:block;font-size:21px;margin-bottom:10px}.card span{font-size:12px;color:#bbb}.card button{margin-top:15px;width:100%;padding:10px;border:0;border-radius:5px;font-weight:bold}.easy button{background:#63c52b}.normal button{background:#eeb400}.hard button{background:#d52d2d;color:#fff}#msg{position:fixed;top:40%;width:100%;text-align:center;font-size:40px;font-weight:900;text-shadow:0 3px 10px #000;pointer-events:none}</style></head><body><canvas id="g"></canvas><div id="hud"><span id="stats"></span><span id="weapon"></span></div><div id="bar"><div id="fill"></div></div><div id="msg"></div><div id="menu"><div><h1>ZOMBIE<br><span>RAGE</span></h1><p>Survive. Kill. Rage.</p><button class="btn play" id="play">▶ PLAY</button><br><button class="btn difficulty" id="difficulty">☠ DIFFICULTY: NORMAL</button><br><button class="btn" id="how">▣ HOW TO PLAY</button><br><button class="btn" id="sound">⚙ SOUND: ON</button></div></div><div id="diff"><div><h2>CHOOSE DIFFICULTY</h2><div class="cards"><div class="card easy"><b>EASY</b><span>Slower zombies<br>More health</span><button data-d="easy">SELECT</button></div><div class="card normal"><b>NORMAL</b><span>Balanced challenge</span><button data-d="normal">SELECT</button></div><div class="card hard"><b>HARD</b><span>Faster zombies<br>More enemies</span><button data-d="hard">SELECT</button></div></div><button class="btn" id="back">← BACK</button></div></div><script>const c=g,x=c.getContext('2d'),hero=new Image(),zed=new Image();hero.src='assets/hero.svg';zed.src='assets/zombie.svg';let W,H,p,Z=[],B=[],FX=[],score=0,wave=0,kills=0,rage=0,rageTime=0,playing=0,soundOn=1,keys={},joy=null,shoot=null,lastShot=0,best=+localStorage.zrBest||0,difficulty='normal';const cfg={easy:{speed:.76,damage:.65,hp:130,count:.8},normal:{speed:1,damage:1,hp:100,count:1},hard:{speed:1.28,damage:1.35,hp:85,count:1.25}},guns=[{n:'PISTOL',rate:260,s:13,spread:0},{n:'SHOTGUN',rate:650,s:12,spread:.25,pel:5},{n:'ASSAULT RIFLE',rate:125,s:15,spread:.04},{n:'HEAVY',rate:85,s:14,spread:.09}];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();function tone(f,d=.05){if(!soundOn)return;try{let a=new AudioContext,o=a.createOscillator(),v=a.createGain();o.frequency.value=f;v.gain.value=.03;o.connect(v);v.connect(a.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function start(){menu.style.display='none';p={x:W/2,y:H/2,hp:cfg[difficulty].hp,max:cfg[difficulty].hp,weapon:0,a:0};Z=[];B=[];FX=[];score=wave=kills=rage=rageTime=0;playing=1;hud.style.display='flex';bar.style.display='block';nextWave()}function nextWave(){wave++;msg.textContent=wave%5===0?'☠ BOSS WAVE ☠':'WAVE '+wave;setTimeout(()=>msg.textContent='',900);let n=Math.ceil((4+wave*2)*cfg[difficulty].count);for(let i=0;i<n;i++)spawn();if(wave%5===0)spawn('boss');if(wave===3)p.weapon=1;if(wave===6)p.weapon=2;if(wave===9)p.weapon=3}function spawn(force){let s=Math.floor(Math.random()*4),type=force||(wave>5&&Math.random()<.14?'tank':wave>2&&Math.random()<.22?'runner':'walker'),q={type,r:22,hp:2,sp:.62*cfg[difficulty].speed,dmg:.22*cfg[difficulty].damage,phase:Math.random()*6};if(type==='runner'){q.r=18;q.hp=1;q.sp=1.15*cfg[difficulty].speed}if(type==='tank'){q.r=32;q.hp=7;q.sp=.4*cfg[difficulty].speed;q.dmg=.48*cfg[difficulty].damage}if(type==='boss'){q.r=48;q.hp=32+wave*2;q.sp=.46*cfg[difficulty].speed;q.dmg=.75*cfg[difficulty].damage}if(s===0){q.x=Math.random()*W;q.y=-70}else if(s===1){q.x=W+70;q.y=Math.random()*H}else if(s===2){q.x=Math.random()*W;q.y=H+70}else{q.x=-70;q.y=Math.random()*H}Z.push(q)}function fire(tx,ty){let w=guns[p.weapon],now=performance.now();if(now-lastShot<w.rate)return;lastShot=now;p.a=Math.atan2(ty-p.y,tx-p.x);for(let i=0;i<(w.pel||1);i++){let a=p.a+(Math.random()-.5)*w.spread*2;B.push({x:p.x+Math.cos(a)*28,y:p.y+Math.sin(a)*28,vx:Math.cos(a)*w.s,vy:Math.sin(a)*w.s});}FX.push({x:p.x+Math.cos(p.a)*35,y:p.y+Math.sin(p.a)*35,l:5,flash:1});tone(150,.035)}function kill(q){q.dead=1;kills++;score+=q.type==='boss'?500:q.type==='tank'?40:10;rage=Math.min(100,rage+(q.type==='boss'?40:8));for(let i=0;i<15;i++)FX.push({x:q.x,y:q.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:35});tone(60,.08)}function activate(){if(rage>=100&&!rageTime){rage=0;rageTime=480;msg.textContent='RAGE!';setTimeout(()=>msg.textContent='',600)}}function end(){playing=0;best=Math.max(best,score);localStorage.zrBest=best;hud.style.display=bar.style.display='none';menu.style.display='grid';menu.querySelector('h1').innerHTML='GAME<br><span>OVER</span>';menu.querySelector('p').textContent=`Score ${score} • Wave ${wave} • Kills ${kills} • Best ${best}`;play.textContent='↻ PLAY AGAIN'}play.onclick=start;difficulty.onclick=()=>{menu.style.display='none';diff.style.display='grid'};back.onclick=()=>{diff.style.display='none';menu.style.display='grid'};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.d;difficulty.textContent;document.querySelector('#difficulty').textContent='☠ DIFFICULTY: '+b.dataset.d.toUpperCase();diff.style.display='none';menu.style.display='grid'});sound.onclick=e=>{soundOn=!soundOn;e.target.textContent='⚙ SOUND: '+(soundOn?'ON':'OFF')};how.onclick=()=>alert('Mobile: left thumb moves. Right thumb aims and shoots. Tap the Rage bar when full. Weapons unlock as waves rise. Boss every 5 waves.');onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')activate()};onkeyup=e=>keys[e.key.toLowerCase()]=0;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);if(e.clientX<W*.45)joy={id:e.pointerId,cx:e.clientX,cy:e.clientY,x:e.clientX,y:e.clientY};else shoot={id:e.pointerId,x:e.clientX,y:e.clientY}};c.onpointermove=e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}if(shoot&&shoot.id===e.pointerId){shoot.x=e.clientX;shoot.y=e.clientY}};c.onpointerup=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(shoot&&shoot.id===e.pointerId)shoot=null};bar.onclick=activate;function ground(){let grd=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H));grd.addColorStop(0,'#211e1a');grd.addColorStop(1,'#090909');x.fillStyle=grd;x.fillRect(0,0,W,H);x.strokeStyle='#332d27';x.lineWidth=3;for(let y=100;y<H;y+=170){x.beginPath();x.moveTo(0,y);x.lineTo(W,y+55);x.stroke()}x.fillStyle='#191613';for(let i=0;i<12;i++){let px=(i*173)%W,py=(i*271)%H;x.fillRect(px,py,45,9);x.fillRect(px+18,py-17,9,43)}}function drawHero(){x.save();x.translate(p.x,p.y);x.rotate(p.a+Math.PI/2);if(rageTime){x.shadowBlur=28;x.shadowColor='#ff3824'}x.drawImage(hero,-42,-48,84,95);x.restore()}function drawZombie(q){x.save();x.translate(q.x,q.y);let a=Math.atan2(p.y-q.y,p.x-q.x);x.rotate(a+Math.PI/2);let bob=Math.sin(performance.now()/130+q.phase)*2,sz=q.type==='boss'?120:q.type==='tank'?88:q.type==='runner'?58:68;x.globalAlpha=.28;x.fillStyle='#000';x.beginPath();x.ellipse(0,24,sz*.28,sz*.12,0,0,7);x.fill();x.globalAlpha=1;x.drawImage(zed,-sz/2,-sz/2+bob,sz,sz*1.12);if(q.type==='tank'||q.type==='boss'){x.strokeStyle=q.type==='boss'?'#ff3425':'#8f9b64';x.lineWidth=3;x.strokeRect(-sz*.38,-sz*.48,sz*.76,sz*.9)}x.restore()}function loop(){requestAnimationFrame(loop);ground();if(!playing)return;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/45);mx=dx/d*s;my=dy/d*s}let md=Math.hypot(mx,my)||1;if(mx||my){p.x+=mx/md*(rageTime?5.7:4);p.y+=my/md*(rageTime?5.7:4)}p.x=Math.max(40,Math.min(W-40,p.x));p.y=Math.max(50,Math.min(H-50,p.y));if(shoot){p.a=Math.atan2(shoot.y-p.y,shoot.x-p.x);fire(shoot.x,shoot.y)}for(const b of B){b.x+=b.vx;b.y+=b.vy;for(const q of Z)if(!b.dead&&!b.dead&&Math.hypot(b.x-q.x,b.y-q.y)<q.r+5){b.dead=1;q.hp-=rageTime?3:1;if(q.hp<=0)kill(q)}}B=B.filter(b=>!b.dead&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const q of Z){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;q.x+=dx/d*q.sp;q.y+=dy/d*q.sp;if(d<q.r+24){if(rageTime){q.hp-=.2;q.x-=dx/d*7;q.y-=dy/d*7;if(q.hp<=0)kill(q)}else{p.hp-=q.dmg;if(p.hp<=0)end()}}}Z=Z.filter(q=>!q.dead);if(!Z.length)nextWave();Z.forEach(drawZombie);drawHero();x.fillStyle='#ffd45b';x.shadowBlur=8;x.shadowColor='#ff8a00';for(const b of B){x.beginPath();x.arc(b.x,b.y,3.5,0,7);x.fill()}x.shadowBlur=0;for(const f of FX){if(f.flash){x.fillStyle='#fff2a0';x.beginPath();x.arc(f.x,f.y,10-f.l,0,7);x.fill()}else{f.x+=f.vx;f.y+=f.vy;f.vx*=.94;f.vy*=.94;x.fillStyle='#6f1713';x.beginPath();x.arc(f.x,f.y,3,0,7);x.fill()}f.l--}FX=FX.filter(f=>f.l>0);if(rageTime)rageTime--;if(joy){x.strokeStyle='#ffffff55';x.lineWidth=4;x.beginPath();x.arc(joy.cx,joy.cy,42,0,7);x.stroke();x.beginPath();x.arc(joy.x,joy.y,18,0,7);x.stroke()}stats.textContent=`HP ${Math.max(0,Math.ceil(p.hp))}/${p.max} • WAVE ${wave} • SCORE ${score}`;weapon.textContent=`${guns[p.weapon].n} • KILLS ${kills}`;fill.style.width=(rageTime?100:rage)+'%';bar.style.boxShadow=rage>=100?'0 0 22px #ff3b20':'none'}loop();</script></body></html>
