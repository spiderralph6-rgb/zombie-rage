<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#080909"><title>Zombie Rage — Last Stand</title><link rel="stylesheet" href="style.css"></head><body><canvas id="game"></canvas><section id="menu" class="screen"><div class="menuContent"><div class="eyebrow">THE CITY HAS FALLEN</div><h1 class="logo">ZOMBIE<br><span>RAGE</span></h1><div class="tag">SURVIVE • KILL • UNLEASH</div><button id="play" class="primary">▶ ENTER THE DEAD ZONE</button><div class="diffRow"><button data-d="easy">EASY</button><button class="active" data-d="normal">NORMAL</button><button data-d="hard">HARD</button></div><button class="secondary" onclick="alert('Move with the left stick. FIRE targets the nearest infected. Fill RAGE by killing enemies, then unleash it. Boss every 5 waves.')">HOW TO PLAY</button></div></section><div id="ui" class="hidden"><div class="hud"><div class="hudBlock">HP <span id="hp">100</span> &nbsp;•&nbsp; WAVE <span id="wave">1</span></div><div class="hudBlock">KILLS <span id="kills">0</span> &nbsp;•&nbsp; SCORE <span id="score">0</span></div></div><div id="bossbar" class="bossbar hidden"><i></i></div><div id="banner"></div><div id="stick"><div id="knob"></div></div><button id="rageBtn">RAGE<br><span id="ragePct">0</span>%</button><button id="fire">✹</button><div class="meterWrap"><div class="meter"><i id="hpFill"></i></div><div class="meter rage"><i id="rageFill"></i></div></div></div><section id="over" class="screen gameover hidden"><div><div class="eyebrow">THE HORDE WON THIS ROUND</div><h2>YOU DIED</h2><p id="final"></p><button id="again" class="primary">↻ FIGHT AGAIN</button></div></section><script src="game.js"></script></body></html>
