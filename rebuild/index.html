<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zombie Rage Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050607;color:#fff;font-family:Arial}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:fixed;top:10px;left:10px;background:#000b;border:1px solid #a42b20;padding:8px 12px;border-radius:8px;font-weight:800}#fire{position:fixed;right:20px;bottom:25px;width:78px;height:78px;border-radius:50%;border:3px solid #ff583d;background:#8d160f;color:white;font-size:28px;box-shadow:0 0 25px #e32b1b88}#stick{position:fixed;left:24px;bottom:28px;width:86px;height:86px;border:2px solid #ffffff55;border-radius:50%}</style></head><body><canvas id="c"></canvas><div id="status">WAVE 1 • KILLS <span id="kills">0</span></div><div id="stick"></div><button id="fire">✹</button><script>const c=document.querySelector('#c'),g=c.getContext('2d'),killEl=document.querySelector('#kills');let W,H,t=0,z=[],fx=[],kills=0,recoil=0;function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}onresize=size;size();function spawn(type){z.push({type:type||(['walker','walker','runner','brute'][Math.floor(Math.random()*4)]),x:(Math.random()-.5)*8,d:14+Math.random()*16,s:type==='runner'?.012:type==='brute'?.004:.007,phase:Math.random()*6,hp:type==='brute'?3:1})}for(let i=0;i<12;i++)spawn();function project(wx,d){let horizon=H*.31,scale=260/d;return{x:W/2+wx*scale,y:horizon+H*.57/d*7,s:scale}}function bg(){let sky=g.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#101821');sky.addColorStop(.58,'#482019');sky.addColorStop(1,'#b43a1e');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#101113';for(let i=0;i<10;i++){let bx=i*W/9-25,bh=80+(i%4)*42;g.fillRect(bx,H*.31-bh,W/10+12,bh);g.fillStyle='#ff6426';for(let j=0;j<4;j++)if((i+j)%2)g.fillRect(bx+12+j*15,H*.31-bh+18+(j%3)*22,6,10);g.fillStyle='#101113'}g.fillStyle='#272727';g.beginPath();g.moveTo(W*.16,H);g.lineTo(W*.43,H*.31);g.lineTo(W*.57,H*.31);g.lineTo(W*.86,H);g.fill();g.fillStyle='#151515';g.beginPath();g.moveTo(0,H);g.lineTo(W*.16,H);g.lineTo(W*.43,H*.31);g.lineTo(0,H*.31);g.fill();g.beginPath();g.moveTo(W,H);g.lineTo(W*.86,H);g.lineTo(W*.57,H*.31);g.lineTo(W,H*.31);g.fill();g.strokeStyle='#c7a957';g.lineWidth=3;g.setLineDash([22,25]);g.beginPath();g.moveTo(W/2,H);g.lineTo(W/2,H*.31);g.stroke();g.setLineDash([]);for(let i=0;i<7;i++){let y=H*.4+i*H*.075,side=i%2?W*.08:W*.76;g.fillStyle='#121212';g.fillRect(side,y,78,29);g.fillStyle='#5b1d14';g.fillRect(side+10,y+5,49,13)}for(let i=0;i<5;i++){let x=(i*173+50)%W,y=H*.36+(i%3)*70;g.fillStyle='#ff5a1c55';g.beginPath();g.arc(x,y,12+Math.sin(t*.1+i)*5,0,7);g.fill()}}function person(x,y,s,type='hero',phase=0,attack=false){g.save();g.translate(x,y);let run=Math.sin(t*(type==='runner'?.22:.13)+phase),bob=Math.abs(run)*s*.035;g.translate(0,-bob);let brute=type==='brute',zs=type!=='hero',wide=brute?1.35:1;g.lineCap='round';g.strokeStyle=zs?(brute?'#566044':'#687454'):'#242a31';g.lineWidth=Math.max(5,s*.12*wide);g.beginPath();g.moveTo(0,-s*.4);g.lineTo(0,s*.02);let arm=attack?s*.25:run*s*.12;g.moveTo(0,-s*.22);g.lineTo(-s*.23,-s*.02+arm);g.moveTo(0,-s*.22);g.lineTo(s*.23,-s*.02-arm);g.moveTo(0,s*.02);g.lineTo(-s*.15+run*s*.09,s*.39);g.moveTo(0,s*.02);g.lineTo(s*.15-run*s*.09,s*.39);g.stroke();g.fillStyle=zs?(brute?'#65704c':'#7b895d'):'#15191f';g.beginPath();g.arc(0,-s*.53,s*(brute?.16:.13),0,7);g.fill();if(zs){g.fillStyle='#ff2e25';g.fillRect(-s*.065,-s*.56,s*.04,s*.025);g.fillRect(s*.025,-s*.56,s*.04,s*.025);g.strokeStyle='#3b1714';g.lineWidth=2;g.beginPath();g.moveTo(-s*.08,-s*.47);g.lineTo(s*.09,-s*.45);g.stroke()}else{g.strokeStyle='#ff3a27';g.lineWidth=4;g.beginPath();g.moveTo(-s*.08,-s*.55);g.lineTo(s*.08,-s*.55);g.stroke();g.fillStyle='#343b45';g.fillRect(s*.1,-s*.29,s*.42,s*.075);g.fillStyle='#111';g.fillRect(s*.38,-s*.27,s*.18,s*.035)}g.restore()}function shoot(){if(!z.length)return;let target=z.reduce((a,b)=>b.d<a.d?b:a);target.hp--;recoil=7;let p=project(target.x,target.d);fx.push({x:p.x,y:p.y,l:9});if(target.hp<=0){z.splice(z.indexOf(target),1);kills++;killEl.textContent=kills;for(let i=0;i<10;i++)fx.push({x:p.x,y:p.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:25,blood:1});spawn(Math.random()<.2?'runner':Math.random()<.15?'brute':'walker')}}document.querySelector('#fire').onpointerdown=e=>{e.preventDefault();shoot()};function frame(){requestAnimationFrame(frame);t++;bg();z.sort((a,b)=>b.d-a.d);for(const q of z){q.d-=q.s*14;if(q.d<4.2){q.d=4.2;q.attack=true}else q.attack=false;let p=project(q.x,q.d),mul=q.type==='brute'?1.35:q.type==='runner'?.9:1;person(p.x,p.y,p.s*mul,q.type,q.phase,q.attack)}for(const f of fx){if(f.blood){f.x+=f.vx;f.y+=f.vy;g.fillStyle='#8e1712';g.beginPath();g.arc(f.x,f.y,3,0,7);g.fill()}else{g.strokeStyle='#ffdd8a';g.lineWidth=3;g.beginPath();g.moveTo(W/2,H*.68);g.lineTo(f.x,f.y);g.stroke();g.fillStyle='#fff3a0';g.beginPath();g.arc(f.x,f.y,9,0,7);g.fill()}f.l--}fx=fx.filter(f=>f.l>0);person(W/2,H*.82+recoil,150,'hero');if(recoil)recoil*=.55;g.fillStyle='#0009';g.fillRect(0,H*.91,W,H*.09);g.fillStyle='#e52c20';g.fillRect(15,H*.94,W*.42,9);g.fillStyle='#ff9b22';g.fillRect(W*.54,H*.94,W*.28,9)}frame();</script></body></html>
