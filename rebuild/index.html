<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zombie Rage Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050607;color:#fff;font-family:Arial}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:fixed;top:10px;left:10px;background:#000b;border:1px solid #a42b20;padding:8px 12px;border-radius:8px;font-weight:800}#fire{position:fixed;right:20px;bottom:25px;width:78px;height:78px;border-radius:50%;border:3px solid #ff583d;background:#8d160f;color:white;font-size:28px}#stick{position:fixed;left:24px;bottom:28px;width:86px;height:86px;border:2px solid #ffffff55;border-radius:50%}</style></head><body><canvas id="c"></canvas><div id="status">WAVE 1 • REBUILD</div><div id="stick"></div><button id="fire">✹</button><script>const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,t=0,z=[];function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}onresize=size;size();for(let i=0;i<10;i++)z.push({x:(Math.random()-.5)*8,d:8+Math.random()*18,s:.004+Math.random()*.006,phase:Math.random()*6});function project(wx,d){let horizon=H*.31,scale=240/d;return{x:W/2+wx*scale,y:horizon+H*.57/d*7,s:scale}}function bg(){let sky=g.createLinearGradient(0,0,0,H*.45);sky.addColorStop(0,'#111820');sky.addColorStop(1,'#6a2519');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#111';for(let i=0;i<9;i++){let x=i*W/8-20,h=70+(i%3)*45;g.fillRect(x,H*.31-h,W/10+8,h);g.fillStyle='#ff5a20';for(let j=0;j<3;j++)g.fillRect(x+10+j*18,H*.31-h+20+(j%2)*22,7,10);g.fillStyle='#111'}g.fillStyle='#252525';g.beginPath();g.moveTo(W*.22,H);g.lineTo(W*.43,H*.31);g.lineTo(W*.57,H*.31);g.lineTo(W*.82,H);g.fill();g.strokeStyle='#d6b85b';g.lineWidth=3;g.setLineDash([24,28]);g.beginPath();g.moveTo(W/2,H);g.lineTo(W/2,H*.31);g.stroke();g.setLineDash([]);for(let i=0;i<6;i++){let y=H*.43+i*H*.09;g.fillStyle='#171717';g.fillRect(i%2?W*.1:W*.75,y,70,28);g.fillStyle='#4a1712';g.fillRect(i%2?W*.11:W*.76,y+5,45,13)}}function human(x,y,s,zombie=false,phase=0){g.save();g.translate(x,y);let bob=Math.sin(t*.08+phase)*s*.03;g.translate(0,bob);g.lineCap='round';g.strokeStyle=zombie?'#697455':'#242a31';g.lineWidth=Math.max(5,s*.13);g.beginPath();g.moveTo(0,-s*.43);g.lineTo(0,s*.05);g.moveTo(0,-s*.2);g.lineTo(-s*.22,s*.02);g.moveTo(0,-s*.2);g.lineTo(s*.22,s*.02);g.moveTo(0,s*.02);g.lineTo(-s*.14,s*.38);g.moveTo(0,s*.02);g.lineTo(s*.14,s*.38);g.stroke();g.fillStyle=zombie?'#77845b':'#15191f';g.beginPath();g.arc(0,-s*.55,s*.13,0,7);g.fill();if(zombie){g.fillStyle='#ff2e25';g.fillRect(-s*.065,-s*.58,s*.04,s*.025);g.fillRect(s*.025,-s*.58,s*.04,s*.025)}else{g.strokeStyle='#ff3a27';g.lineWidth=3;g.beginPath();g.moveTo(-s*.08,-s*.57);g.lineTo(s*.08,-s*.57);g.stroke();g.fillStyle='#343b45';g.fillRect(s*.12,-s*.27,s*.36,s*.07)}g.restore()}function frame(){requestAnimationFrame(frame);t++;bg();z.sort((a,b)=>b.d-a.d);for(const q of z){q.d-=q.s*16;if(q.d<4){q.d=24;q.x=(Math.random()-.5)*8}let p=project(q.x,q.d);human(p.x,p.y,p.s*.95,true,q.phase)}human(W/2,H*.82,145,false);g.fillStyle='#0008';g.fillRect(0,H*.91,W,H*.09);g.fillStyle='#e52c20';g.fillRect(15,H*.94,W*.42,9);g.fillStyle='#ff9b22';g.fillRect(W*.54,H*.94,W*.28,9)}frame();</script></body></html>
